# Netlify Configuration for IWSM Website
[build]
  # Static site published directly from root
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
